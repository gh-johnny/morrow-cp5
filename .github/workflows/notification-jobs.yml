name: Resume push jobs and provider receipts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-jobs
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke authenticated worker
        env:
          MORROW_CRON_SECRET: ${{ secrets.MORROW_CRON_SECRET }}
        run: |
          test -n "$MORROW_CRON_SECRET"
          curl --fail --silent --show-error --max-time 55 \
            -X POST -H "Authorization: Bearer $MORROW_CRON_SECRET" \
            https://morrow-cp5.vercel.app/api/jobs/run
